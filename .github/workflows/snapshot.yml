name: snapshot

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/snapshot.py
      - name: Commit changes
        run: |
          git config user.name "swarm-harvester-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
